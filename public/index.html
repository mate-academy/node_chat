<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node Chat</title>
<style>
  :root { --ink:#19232e; --ink2:#26333f; --paper:#eef1f5; --line:#d5dbe3; --accent:#0f766e; --text:#1b2530; --muted:#6b7785; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--paper); }
  button, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  #login { height: 100%; display: grid; place-items: center; padding: 16px; }
  #login form { width: min(360px, 100%); display: grid; gap: 12px; }
  #login h1 { margin: 0 0 4px; font-size: 28px; }
  #login p { margin: 0; color: var(--muted); }

  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .primary { padding: 10px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; }
  .error { color: #b42318; min-height: 1.4em; margin: 0; }

  #app { height: 100%; display: grid; grid-template-columns: 260px 1fr; }
  aside { background: var(--ink); color: #dfe6ee; display: flex; flex-direction: column; min-height: 0; }
  aside header { display: flex; align-items: center; justify-content: space-between; padding: 16px; font-weight: 600; }
  aside header button { background: var(--ink2); color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; }
  #rooms { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
  #rooms li { display: flex; align-items: center; border-radius: 6px; }
  #rooms li.active { background: var(--ink2); box-shadow: inset 3px 0 var(--accent); }
  #rooms .join { flex: 1; text-align: left; background: none; border: 0; color: inherit; padding: 8px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rooms .tool { background: none; border: 0; color: #93a1b1; padding: 6px; }
  #rooms .tool:hover { color: #fff; }
  .me { padding: 12px 16px; border-top: 1px solid var(--ink2); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .me button { background: none; border: 0; color: #93a1b1; text-decoration: underline; }

  main { display: flex; flex-direction: column; min-height: 0; }
  main header { padding: 14px 20px; border-bottom: 1px solid var(--line); background: #fff; font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: min(640px, 85%); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .msg.mine { align-self: flex-end; background: #dcf1ee; border-color: #b6dfd9; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; }
  .meta b { color: var(--text); }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--muted); margin: auto; }
  #composer { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: #fff; }

  @media (max-width: 640px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height: 38vh; }
  }
</style>
</head>
<body>
<section id="login" hidden>
  <form id="loginForm">
    <h1>Pick a username</h1>
    <p>It will be shown next to every message you send.</p>
    <input id="usernameInput" type="text" maxlength="24" autocomplete="off" aria-label="Username" required>
    <p class="error" id="loginError" role="alert"></p>
    <button class="primary" type="submit">Start chatting</button>
  </form>
</section>

<div id="app" hidden>
  <aside>
    <header>Rooms <button id="createRoom" title="Create room">+ New</button></header>
    <ul id="rooms"></ul>
    <div class="me"><span>Signed in as <b id="meName"></b></span><button id="changeName">Change</button></div>
  </aside>
  <main>
    <header id="roomTitle"></header>
    <div id="messages" aria-live="polite"></div>
    <form id="composer">
      <input id="text" type="text" maxlength="2000" autocomplete="off" placeholder="Write a message" aria-label="Message">
      <button class="primary" type="submit">Send</button>
    </form>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';

const socket = io();
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } },
};

let username = store.get('username');
let currentRoomId = null;
let rooms = [];

const emit = (event, payload) =>
  new Promise((resolve) => socket.emit(event, payload, resolve));

function showLogin(message = '') {
  $('app').hidden = true;
  $('login').hidden = false;
  $('loginError').textContent = message;
  $('usernameInput').value = username || '';
  $('usernameInput').focus();
}

async function login(name) {
  const res = await emit('username:set', name);
  if (!res.ok) { showLogin(res.error); return false; }
  username = res.username;
  store.set('username', username); // remembered across visits
  $('meName').textContent = username;
  $('login').hidden = true;
  $('app').hidden = false;
  await joinRoom(currentRoomId && rooms.some((r) => r.id === currentRoomId)
    ? currentRoomId
    : store.get('roomId') || 'general');
  return true;
}

async function joinRoom(id) {
  let res = await emit('room:join', id);
  if (!res.ok && id !== 'general') res = await emit('room:join', 'general');
  if (!res.ok) return;
  currentRoomId = res.room.id;
  store.set('roomId', currentRoomId);
  $('roomTitle').textContent = res.room.name;
  $('messages').replaceChildren();
  if (!res.messages.length) addEmpty();
  res.messages.forEach(addMessage);
  renderRooms();
  $('text').focus();
}

function addEmpty() {
  const p = document.createElement('p');
  p.className = 'empty';
  p.textContent = 'No messages yet. Say hello.';
  $('messages').append(p);
}

function addMessage(m) {
  $('messages').querySelector('.empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg' + (m.author === username ? ' mine' : '');
  const meta = document.createElement('div');
  meta.className = 'meta';
  const who = document.createElement('b');
  who.textContent = m.author;
  const time = document.createElement('time');
  const d = new Date(m.time);
  time.dateTime = m.time;
  time.title = d.toLocaleString();
  time.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  meta.append(who, time);
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = m.text; // textContent: no HTML injection
  el.append(meta, body);
  const box = $('messages');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.append(el);
  if (atBottom || m.author === username) box.scrollTop = box.scrollHeight;
}

function renderRooms() {
  const list = $('rooms');
  list.replaceChildren();
  for (const r of rooms) {
    const li = document.createElement('li');
    if (r.id === currentRoomId) li.className = 'active';
    const join = document.createElement('button');
    join.className = 'join';
    join.textContent = '# ' + r.name;
    join.onclick = () => r.id !== currentRoomId && joinRoom(r.id);
    li.append(join);
    const rename = document.createElement('button');
    rename.className = 'tool';
    rename.textContent = 'Rename';
    rename.onclick = () => renameRoom(r);
    li.append(rename);
    if (r.id !== 'general') {
      const del = document.createElement('button');
      del.className = 'tool';
      del.textContent = 'Delete';
      del.onclick = () => deleteRoom(r);
      li.append(del);
    }
    list.append(li);
  }
  const current = rooms.find((r) => r.id === currentRoomId);
  if (current) $('roomTitle').textContent = current.name;
}

async function createRoom() {
  const name = prompt('New room name');
  if (!name) return;
  const res = await emit('room:create', name);
  if (!res.ok) return alert(res.error);
  joinRoom(res.id);
}

async function renameRoom(room) {
  const name = prompt('Rename room', room.name);
  if (!name || name === room.name) return;
  const res = await emit('room:rename', { id: room.id, name });
  if (!res.ok) alert(res.error);
}

async function deleteRoom(room) {
  if (!confirm(`Delete "${room.name}" and all its messages?`)) return;
  const res = await emit('room:delete', room.id);
  if (!res.ok) alert(res.error);
}

socket.on('rooms:list', (list) => { rooms = list; renderRooms(); });
socket.on('message:new', ({ roomId, message }) => { if (roomId === currentRoomId) addMessage(message); });
socket.on('room:deleted', (id) => { if (id === currentRoomId) joinRoom('general'); });

// (Re)authenticate automatically on first load and after reconnects.
socket.on('connect', () => (username ? login(username) : showLogin()));

$('loginForm').addEventListener('submit', (e) => { e.preventDefault(); login($('usernameInput').value); });
$('changeName').onclick = () => showLogin();
$('createRoom').onclick = createRoom;
$('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  const res = await emit('message:send', text);
  if (!res.ok) alert(res.error);
});
</script>
</body>
</html>
