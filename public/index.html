<!doctype html>
<html>
  <head>
    <title>JS Chat - WebSocket</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        height: 100vh;
        margin: 0;
        background: #f0f2f5;
      }
      #auth-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      #chat-screen {
        display: none;
        width: 100%;
        height: 100%;
      }
      .sidebar {
        width: 260px;
        background: #ffffff;
        border-right: 1px solid #ddd;
        display: flex;
        flex-direction: column;
      }
      .main-chat {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      .messages-area {
        flex-grow: 1;
        overflow-y: auto;
        padding: 20px;
        background: #fff;
      }
      .input-area {
        padding: 20px;
        background: #fff;
        border-top: 1px solid #ddd;
        display: flex;
        gap: 10px;
      }
      .room-item {
        padding: 12px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
      }
      .room-item:hover {
        background: #f5f5f5;
      }
      .room-item.active {
        background: #e7f3ff;
        color: #1877f2;
        font-weight: bold;
      }
      .message {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 8px;
        background: #f1f0f0;
        max-width: 80%;
      }
      .msg-meta {
        font-size: 11px;
        color: #65676b;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="auth-screen">
      <h1>Введіть ваш Username</h1>
      <input type="text" id="usernameInput" placeholder="Мій нікнейм..." />
      <button onclick="login()" style="margin-top: 10px; padding: 10px 20px">
        Увійти
      </button>
    </div>

    <div id="chat-screen">
      <div class="sidebar">
        <div style="padding: 15px; border-bottom: 1px solid #ddd">
          <button onclick="createNewRoom()">+ Нова кімната</button>
        </div>
        <div id="rooms-list"></div>
      </div>
      <div class="main-chat">
        <div
          style="
            padding: 15px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
          "
          id="active-room-title"
        >
          General
        </div>
        <div class="messages-area" id="messages-area"></div>
        <div class="input-area">
          <input
            type="text"
            id="msgInput"
            style="flex-grow: 1"
            placeholder="Напишіть щось..."
          />
          <button onclick="sendMsg()">Відправити</button>
        </div>
      </div>
    </div>

    <script>
      let socket;
      let currentRoom = 'general';
      let myUser = localStorage.getItem('chat_username');

      if (myUser) {
        initChat();
      }

      function login() {
        const val = document.getElementById('usernameInput').value.trim();
        if (val) {
          localStorage.setItem('chat_username', val);
          myUser = val;
          initChat();
        }
      }

      function initChat() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';

        socket = new WebSocket('ws://localhost:8080');

        socket.onopen = () => {
          socket.send(
            JSON.stringify({
              type: 'JOIN_ROOM',
              roomId: currentRoom,
              username: myUser,
            }),
          );
        };

        socket.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === 'ROOMS_LIST') updateRoomsUI(data.rooms);
          if (data.type === 'ROOM_HISTORY') renderHistory(data.messages);
          if (data.type === 'MESSAGE') appendMessage(data.message);
          if (data.type === 'ROOM_DELETED') switchRoom('general');
        };
      }

      function updateRoomsUI(rooms) {
        const list = document.getElementById('rooms-list');
        list.innerHTML = '';
        rooms.forEach((r) => {
          const div = document.createElement('div');
          div.className = `room-item ${r.id === currentRoom ? 'active' : ''}`;
          div.innerHTML = `<span>${r.name}</span>`;

          const btnContainer = document.createElement('div');
          if (r.id !== 'general') {
            const ren = document.createElement('button');
            ren.innerText = 'R';
            ren.onclick = (e) => {
              e.stopPropagation();
              renameRoom(r.id);
            };
            const del = document.createElement('button');
            del.innerText = 'D';
            del.onclick = (e) => {
              e.stopPropagation();
              deleteRoom(r.id);
            };
            btnContainer.append(ren, del);
          }
          div.append(btnContainer);
          div.onclick = () => switchRoom(r.id);
          list.append(div);
        });
      }

      function switchRoom(id) {
        currentRoom = id;
        socket.send(
          JSON.stringify({ type: 'JOIN_ROOM', roomId: id, username: myUser }),
        );
        document.getElementById('active-room-title').innerText = id;
      }

      function renderHistory(msgs) {
        const area = document.getElementById('messages-area');
        area.innerHTML = '';
        msgs.forEach(appendMessage);
      }

      function appendMessage(m) {
        const area = document.getElementById('messages-area');
        const div = document.createElement('div');
        div.className = 'message';
        const time = new Date(m.time).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
        });
        div.innerHTML = `<div class="msg-meta">${m.author} • ${time}</div><div>${m.text}</div>`;
        area.append(div);
        area.scrollTop = area.scrollHeight;
      }

      function sendMsg() {
        const input = document.getElementById('msgInput');
        if (input.value.trim()) {
          socket.send(
            JSON.stringify({ type: 'NEW_MESSAGE', text: input.value }),
          );
          input.value = '';
        }
      }

      function createNewRoom() {
        const n = prompt('Назва кімнати:');
        if (n)
          socket.send(JSON.stringify({ type: 'CREATE_ROOM', roomName: n }));
      }

      function renameRoom(id) {
        const n = prompt('Нова назва:');
        if (n)
          socket.send(
            JSON.stringify({ type: 'RENAME_ROOM', roomId: id, newName: n }),
          );
      }

      function deleteRoom(id) {
        if (confirm('Видалити?'))
          socket.send(JSON.stringify({ type: 'DELETE_ROOM', roomId: id }));
      }
    </script>
  </body>
</html>
