<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen">
            <h2>Welcome to Node Chat</h2>
            <input type="text" id="username-input" placeholder="Enter your username">
            <button id="login-btn">Enter</button>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="hidden">
            <div class="sidebar">
                <h3>Rooms</h3>
                <ul id="room-list"></ul>
                <div class="room-controls">
                    <input type="text" id="new-room-input" placeholder="New room name">
                    <button id="create-room-btn">Create</button>
                </div>
            </div>
            <div class="main-chat">
                <div class="chat-header">
                    <h3 id="current-room-name">Select a room</h3>
                    <div id="room-actions" class="hidden">
                        <button id="delete-room-btn">Delete Room</button>
                    </div>
                </div>
                <div id="messages-container"></div>
                <div class="message-input-area">
                    <input type="text" id="message-input" placeholder="Type a message...">
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
