<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Node chat</title>
  </head>
  <body>
    <main class="container">
      <h1 class="title">Node chat</h1>
      <form id="loginForm">
        <input
          class="input is-medium"
          type="text"
          placeholder="Enter your username"
        />
        <button type="submit" class="button is-dark">Enter</button>
      </form>
      <div class="dashboard">
        <div class="dashboard__section dashboard__messages">
          <h3
            class="is-size-4 has-text-weight-bold has-text-primary has-text-centered"
          >
            Messages
          </h3>
          <form id="messageForm">
            <input
              class="input is-normal"
              type="text"
              placeholder="Enter message"
            />
            <button type="submit" class="button is-primary">Enter</button>
          </form>
          <ul class="dashboard__messages--list">
            <li>
              <p class="has-text-weight-bold">Username</p>
              <p class="">Message content</p>
              <p class="is-size-7">Message date</p>
            </li>
          </ul>
        </div>
        <div class="dashboard__section dashboard__rooms">
          <h3
            class="is-size-4 has-text-weight-bold has-text-warning has-text-centered"
          >
            Rooms
          </h3>
          <form id="roomForm">
            <input
              class="input is-normal"
              type="text"
              placeholder="Enter room name"
            />
            <button type="submit" class="button is-warning">Enter</button>
          </form>
          <ul class="dashboard__rooms--list">
            <li>
              <div>
                <p>Room name</p>
                <p class="is-size-7">by <b>username</b></p>
              </div>
              <div>
                <span class="icon">
                  <i class="fa-solid fa-pen-to-square"></i>
                </span>
                <span class="icon has-text-danger">
                  <i class="fa-solid fa-xmark"></i>
                </span>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </main>
  </body>
  <script src="main.js"></script>
</html>
