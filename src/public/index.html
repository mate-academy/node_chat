<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>Enter your username</h1>
      <input id="username-input" type="text" placeholder="Username" autocomplete="off" maxlength="20">
      <button id="username-submit">Join chat</button>
    </div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span id="current-username"></span>
      </div>
      <div class="rooms-header">
        <h2>Rooms</h2>
        <button id="add-room-btn" title="Create room">+</button>
      </div>
      <ul id="rooms-list"></ul>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <h2 id="room-title">Room</h2>
        <div class="room-actions">
          <button id="rename-room-btn">Rename</button>
          <button id="delete-room-btn">Delete</button>
        </div>
      </header>

      <ul id="messages-list" class="messages-list"></ul>

      <form id="message-form" class="message-form">
        <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="client.js"></script>
</body>
</html>
