<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Chat</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="login" data-login>
        <form class="login__card" data-login-form>
          <p class="eyebrow">Node Chat</p>
          <h1>Choose your username</h1>
          <p class="muted">
            Your name is stored locally in this browser.
          </p>

          <label class="field">
            <span>Username</span>
            <input
              name="username"
              autocomplete="nickname"
              maxlength="40"
              required
            >
          </label>

          <button type="submit">Enter chat</button>
          <p class="feedback" data-login-feedback aria-live="polite"></p>
        </form>
      </section>

      <section class="chat is-hidden" data-chat>
        <aside class="sidebar">
          <div class="brand">
            <div>
              <p class="eyebrow">Node Chat</p>
              <h1>Rooms</h1>
            </div>
            <button
              class="button button--ghost"
              type="button"
              data-change-user
            >
              Change user
            </button>
          </div>

          <form class="create-room" data-room-form>
            <label class="field">
              <span>New room</span>
              <div class="field-row">
                <input
                  name="name"
                  maxlength="60"
                  placeholder="e.g. Backend"
                  required
                >
                <button type="submit">Create</button>
              </div>
            </label>
          </form>

          <p class="feedback" data-room-feedback aria-live="polite"></p>
          <ul class="rooms" data-rooms></ul>
        </aside>

        <section class="conversation">
          <header class="conversation__header">
            <div>
              <p class="eyebrow">Signed in as <strong data-user></strong></p>
              <h2 data-room-title>General</h2>
            </div>
            <p class="connection" data-connection>Ready</p>
          </header>

          <ol class="messages" data-messages></ol>

          <form class="message-form" data-message-form>
            <label class="field field--grow">
              <span>Message</span>
              <input
                name="text"
                maxlength="1000"
                placeholder="Write a message…"
                autocomplete="off"
                required
              >
            </label>
            <button type="submit">Send</button>
          </form>
          <p class="feedback" data-message-feedback aria-live="polite"></p>
        </section>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
