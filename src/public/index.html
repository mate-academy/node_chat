<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чат</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="chat_icon.png" />
</head>
<body>
  <div class="app">
    <form id="usernameForm" class="username_form">
      <h2>👋 Привіт! Як тебе звати?</h2>
      <input type="text" id="usernameInput" class="username_input" placeholder="Введи імʼя" />
      <button type="submit" class="username_button">Продовжити</button>
    </form>

    <div id="mainUI" class="hidden">
      <div class="room_list" id="roomSection">
        <h2>📚 Кімнати</h2>
        <ul id="roomList" class="room_listed"></ul>
        <input type="text" id="newRoomInput" placeholder="Назва нової кімнати" />
        <button id="createRoomBtn">Створити</button>
      </div>

      <div class="chat hidden" id="chatSection">
        <h2 id="welcomeUser"></h2>
        <div id="messages" class="messages"></div>
        <form id="sendMessageForm" class="send_form">
          <input type="text" id="messageInput" placeholder="Напиши щось..." />
          <button type="submit">📨</button>
        </form>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
