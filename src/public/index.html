<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Node Chat</title>
  <style>
    body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
    #sidebar { width: 250px; background: #eee; padding: 20px; border-right: 1px solid #ccc; }
    #chat-area { flex: 1; display: flex; flex-direction: column; padding: 20px; }
    #messages { flex: 1; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    .message { margin-bottom: 10px; padding: 5px; background: #f9f9f9; border-radius: 5px; }
    .meta { font-size: 0.8em; color: #888; }

    /* Login Modal Styles */
    #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; }
    #login-box { background: white; padding: 40px; border-radius: 8px; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="login-modal">
    <div id="login-box">
      <h2>Enter Username</h2>
      <input type="text" id="username-input" placeholder="Username...">
      <button onclick="login()">Join Chat</button>
    </div>
  </div>

  <div id="sidebar">
    <h3>Rooms</h3>
    <ul id="room-list" style="list-style: none; padding: 0;"></ul>
    <hr>
    <input type="text" id="new-room-input" placeholder="New room name">
    <button onclick="createRoom()">Create</button>
  </div>

  <div id="chat-area">
    <h2 id="current-room-name">Select a Room</h2>
    <div id="messages"></div>
    <div style="display: flex;">
      <input type="text" id="message-input" style="flex: 1;" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = null;
    let currentRoom = null;

    function checkLogin() {
      const storedUser = localStorage.getItem('chat_username');
      if (storedUser) {
        currentUser = storedUser;
        document.getElementById('login-modal').classList.add('hidden');
      }
    }

    function login() {
      const input = document.getElementById('username-input').value;
      if (input) {
        localStorage.setItem('chat_username', input);
        currentUser = input;
        document.getElementById('login-modal').classList.add('hidden');
      }
    }

    socket.on('roomsList', (rooms) => {
      const list = document.getElementById('room-list');
      list.innerHTML = '';

      rooms.forEach(room => {
        const li = document.createElement('li');
        li.innerHTML = `
          <b onclick="joinRoom('${room}')" style="cursor:pointer; color:blue;">${room}</b>
          <button onclick="deleteRoom('${room}')" style="font-size:0.6em; margin-left:5px;">x</button>
          <button onclick="renameRoom('${room}')" style="font-size:0.6em;">rn</button>`;
        list.appendChild(li);
      });

      if (currentRoom && !rooms.includes(currentRoom)) {
        alert(`The room "${currentRoom}" has been deleted or renamed.`);
        leaveCurrentRoom();
      }
    });

    function leaveCurrentRoom() {
      currentRoom = null;
      document.getElementById('current-room-name').innerText = 'Select a Room';
      document.getElementById('messages').innerHTML = '';
    }

    function createRoom() {
      const name = document.getElementById('new-room-input').value;
      if (name) {
        socket.emit('createRoom', name);
      }
      document.getElementById('new-room-input').value = '';
    }

    function deleteRoom(room) {
      if (confirm(`Delete room ${room}?`)) {
        socket.emit('deleteRoom', room);
      }
    }

    function renameRoom(oldName) {
      const newName = prompt('Enter a new name: ');
      if (newName) {
        socket.emit('renameRoom', { oldName, newName });
      }
    }

    function joinRoom(room) {
      currentRoom = room;
      document.getElementById('current-room-name').innerText = room;
      document.getElementById('messages').innerHTML = '';
      socket.emit('joinRoom', room);
    }


    socket.on('messageHistory', (history) => {
      history.forEach(displayMessage);
    });

    socket.on('message', (msg) => {
      displayMessage(msg);
    });

    function sendMessage() {
      const text = document.getElementById('message-input').value;
      if (text && currentRoom && currentUser) {
        socket.emit('chatMessage', { room: currentRoom, author: currentUser, text});
        document.getElementById('message-input').value = '';
      }
    }

    function displayMessage(msg) {
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `
        <div><strong>${msg.author}</strong> <span class="meta">${msg.time}</span></div>
        <div>${msg.text}</div>
      `;
      const container = document.getElementById('messages');
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    checkLogin();
  </script>
</body>
</html>
