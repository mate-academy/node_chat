services:
  chat-postgres:
    image: postgres:16
    container_name: node-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: node_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - node_chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d node_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  chat-migrate:
    build:
      context: .
      target: builder
    container_name: node-chat-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@chat-postgres:5432/node_chat
    depends_on:
      chat-postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  chat-backend:
    build:
      context: .
      target: runner
    image: node-chat-backend
    container_name: node-chat-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@chat-postgres:5432/node_chat
      FRONTEND_URL: http://localhost:3001
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      chat-postgres:
        condition: service_healthy
      chat-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3000
    image: node-chat-client
    container_name: node-chat-client
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      chat-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  node_chat_postgres_data:
